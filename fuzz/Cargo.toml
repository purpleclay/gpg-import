[package]
name = "gpg-import-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
gpg-import = { path = ".." }
libfuzzer-sys = "0.4"

# A separate workspace keeps the nightly-only fuzz build out of the main crate's
[workspace]
members = ["."]

[[bin]]
name = "colon_records"
path = "fuzz_targets/colon_records.rs"
test = false
doc = false
bench = false

[[bin]]
name = "key_input"
path = "fuzz_targets/key_input.rs"
test = false
doc = false
bench = false
