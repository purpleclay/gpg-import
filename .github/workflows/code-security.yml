name: code_security
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: "0 5 * * *" # daily, as advisories are published against lockfiles already merged

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  cargo_deny:
    name: cargo_deny
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      security-events: write # needed by codeql-action/upload-sarif to publish scan results as code scanning alerts
    steps:
      - name: harden_runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            cache.nixos.org:443
            cachix.org:443
            github.com:443
            index.crates.io:443
            purpleclay.cachix.org:443
            releases.nixos.org:443
            static.crates.io:443
            static.rust-lang.org:443

      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: install_nix
        uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # 31.11.3
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: setup_cachix
        uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: purpleclay
          authToken: "${{ secrets.GH_CACHIX }}"
          skipPush: true
          useDaemon: false

      # cargo-deny exits 0 with `--format sarif`, even when advisories are
      # found. This step only produces the report; `check_advisories` below
      # fails the job. Locations are made relative to the repository root.
      - name: generate_sarif
        run: |
          nix develop -c sh -c 'cargo deny --format sarif check advisories > cargo-deny.sarif'
          jq --arg root "$GITHUB_WORKSPACE/" \
            '(.runs[].results[].locations[].physicalLocation.artifactLocation.uri) |= ltrimstr($root)' \
            cargo-deny.sarif > cargo-deny-relative.sarif

      - name: upload_sarif
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: cargo-deny-relative.sarif
          category: cargo-deny

      - name: check_advisories
        run: nix develop -c cargo deny check advisories
