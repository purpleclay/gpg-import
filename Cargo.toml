[package]
authors = ["Purple Clay <purpleclaygh@gmail.com>"]
description = "Import and configure GPG signing for git"
name = "gpg-import"
edition = "2024"
license = "MIT"
rust-version = "1.97.1"
version = "0.11.0"

[profile.release]
strip = "debuginfo"

[dependencies]
anyhow = "1.0.86"
base64 = "0.23.0"
chrono = { version = "0.4.31", default-features = false, features = [
    "std",
    "clock",
] }
clap = { version = "4.4.8", features = ["derive", "env"] }
thiserror = "2.0.0"

[dev-dependencies]
insta = "1.42"
serial_test = "4.0"
tempfile = "3.8"
